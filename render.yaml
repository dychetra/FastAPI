# Render.com blueprint: New + > Blueprint > pick this repo.
# You will be asked for DATABASE_URL (from Neon) and APP_PASSWORD (your choice).
services:
  - type: web
    name: grocery-price-tracker
    runtime: python
    plan: free
    rootDir: grocery
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
